name: Android signed APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: gold-development
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          set -euo pipefail
          test -n "$DOTENV" || { echo '::error::DOTENV secret is missing'; exit 1; }
          printf '%s' "$DOTENV" > .env

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo '::error::ANDROID_KEYSTORE_B64 secret is missing'; exit 1; }
          test -n "$KEY_PROPERTIES" || { echo '::error::ANDROID_KEY_PROPERTIES secret is missing'; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s' "$KEY_PROPERTIES" > android/app/key.properties
          test -s android/app/upload-keystore.jks

      - name: Fetch dependencies
        run: flutter pub get

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Verify release certificate
        env:
          EXPECTED_SHA256: c7dcc6db4352e51313806b59ed2c3baebd64dc27d005b75e44cffda864748483
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          APK=build/app/outputs/flutter-apk/app-release.apk
          CERT="$($APKSIGNER verify --print-certs "$APK")"
          echo "$CERT"
          echo "$CERT" | grep -q 'CN=Sozo Gold'
          ACTUAL="$(echo "$CERT" | sed -nE 's/.*SHA-256 digest: ([0-9a-f]+).*/\1/p')"
          test "$ACTUAL" = "$EXPECTED_SHA256"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Sozo-Gold-signed-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
