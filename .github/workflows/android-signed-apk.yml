name: Android signed APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: gold-development
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          set -euo pipefail
          # Runtime integrations already degrade safely when optional keys are
          # absent. A missing build-only secret must not prevent the APK from
          # being produced; never commit or print its value.
          if [ -n "$DOTENV" ]; then
            printf '%s' "$DOTENV" > .env
          else
            : > .env
            echo '::warning::DOTENV secret is not configured; building with an empty optional .env'
          fi

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo '::error::ANDROID_KEYSTORE_B64 secret is missing'; exit 1; }
          test -n "$KEY_PROPERTIES" || { echo '::error::ANDROID_KEY_PROPERTIES secret is missing'; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s' "$KEY_PROPERTIES" > android/app/key.properties
          test -s android/app/upload-keystore.jks

      - name: Fetch dependencies
        run: flutter pub get

      - name: Build ABI-split release APKs
        # The universal APK bundled every native video/torrent library for
        # every CPU. Users now download only the ABI their phone needs.
        run: flutter build apk --release --split-per-abi

      - name: Verify release certificate
        env:
          EXPECTED_SHA256: c7dcc6db4352e51313806b59ed2c3baebd64dc27d005b75e44cffda864748483
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          for APK in build/app/outputs/flutter-apk/app-*-release.apk; do
            CERT="$($APKSIGNER verify --print-certs "$APK")"
            echo "$APK"
            echo "$CERT"
            echo "$CERT" | grep -q 'CN=Sozo Gold'
            ACTUAL="$(echo "$CERT" | sed -nE 's/.*SHA-256 digest: ([0-9a-f]+).*/\1/p')"
            test "$ACTUAL" = "$EXPECTED_SHA256"
          done

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Sozo-Gold-signed-abi-split
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 30
